<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59,130,246,.12), transparent 34%),
                radial-gradient(circle at top right, rgba(34,197,94,.10), transparent 28%),
                linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
            color: #333;
            min-height: 100vh;
        }

        /* ===== Navbar ===== */
        .navbar {
            background: #1e293b;
            color: #fff;
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }
        .navbar .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: .5px;
            margin-right: 40px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,.6);
            font-size: 15px;
            padding: 16px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all .2s;
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active {
            color: #fff;
            border-bottom-color: #3b82f6;
        }

        /* ===== Container ===== */
        .container {
            max-width: 1280px;
            margin: 24px auto;
            padding: 0 20px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== Assistant Chat ===== */
        .assistant-shell {
            background: rgba(255,255,255,.92);
            border: 1px solid rgba(148,163,184,.22);
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(15,23,42,.10);
            padding: 22px;
            height: calc(100vh - 118px);
            min-height: 640px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }
        .assistant-head h3 {
            color: #1e293b;
            font-size: 20px;
            margin-bottom: 4px;
        }
        .assistant-head p {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .assistant-messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #dbe4f0;
            background: linear-gradient(180deg, #fbfdff 0%, #f5f8fc 100%);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        .assistant-msg {
            max-width: min(92%, 820px);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .assistant-msg.user {
            margin-left: auto;
            background: #2563eb;
            color: #fff;
        }
        .assistant-msg.assistant {
            margin-right: auto;
            background: #fff;
            color: #1f2937;
            border: 1px solid #e2e8f0;
        }
        .assistant-input-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            position: sticky;
            bottom: 0;
            padding: 12px 0 2px;
            align-items: flex-end;
            background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.96) 28%, rgba(255,255,255,.99));
        }
        .assistant-input-row textarea {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 48px;
            max-height: 180px;
            line-height: 1.5;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(15,23,42,.05);
        }
        .assistant-input-row textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.15);
        }
        .assistant-send {
            border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 14px;
            cursor: pointer;
            min-width: 88px;
            box-shadow: 0 10px 20px rgba(37,99,235,.18);
        }
        .assistant-send:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .assistant-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 8px;
        }
        .assistant-insights {
            display: none;
        }
        .assistant-chart-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            padding: 14px;
            min-height: 280px;
        }
        .assistant-msg-charts {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .assistant-msg-chart-card {
            background: #f8fafc;
            border: 1px solid #dbe4f0;
            border-radius: 10px;
            padding: 12px;
        }
        .assistant-msg-chart-card h5 {
            font-size: 13px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .assistant-msg-chart-wrap {
            position: relative;
            height: 170px;
        }
        .assistant-chart-card h4 {
            color: #1e293b;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .assistant-chart-wrap {
            position: relative;
            height: 220px;
        }

        /* ===== Cards ===== */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1e293b;
        }

        /* ===== Stat Cards ===== */
        .stat-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            padding: 24px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 30px;
            font-weight: 700;
        }
        .stat-card .sub {
            font-size: 13px;
            margin-top: 6px;
        }

        /* ===== Chart Row ===== */
        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
        }
        .chart-wrapper canvas { width: 100% !important; }

        /* ===== Tables ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead th {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid #e2e8f0;
            color: #64748b;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
        }
        tbody tr:nth-child(even) { background: #f9fafb; }
        tbody tr:hover { background: #f0f4ff; }

        .positive { color: #16a34a; font-weight: 600; }
        .negative { color: #dc2626; font-weight: 600; }

        /* ===== Buttons ===== */
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s;
        }
        .btn:hover { opacity: .85; }
        .btn-buy { background: #3b82f6; color: #fff; }
        .btn-sell { background: #ef4444; color: #fff; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-group { display: flex; gap: 6px; }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            width: 420px;
            max-width: 90vw;
            box-shadow: 0 12px 40px rgba(0,0,0,.2);
        }
        .modal h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        .modal .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }
        .modal .info-row .info-label { color: #64748b; }
        .modal .info-row .info-value { font-weight: 600; }
        .modal label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin: 16px 0 6px;
        }
        .modal input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .modal input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
        .modal .estimate {
            margin-top: 12px;
            padding: 12px;
            background: #f0f4ff;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        .modal .estimate strong { font-size: 18px; }
        .modal .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .modal .btn-row .btn {
            flex: 1;
            padding: 10px;
            font-size: 15px;
        }
        .btn-cancel {
            background: #e2e8f0;
            color: #475569;
        }
        .btn-confirm-buy { background: #3b82f6; color: #fff; }
        .btn-confirm-sell { background: #ef4444; color: #fff; }
        .modal .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        /* ===== Hover Chart ===== */
        .hover-chart {
            display: none;
            position: fixed;
            z-index: 150;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,.15);
            padding: 12px;
            width: 280px;
            height: 180px;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

        /* ===== Loading ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .stat-row { grid-template-columns: 1fr; }
            .chart-row { grid-template-columns: 1fr; }
            .assistant-msg-charts { grid-template-columns: 1fr; }
            .stat-card .value { font-size: 24px; }
            table { font-size: 12px; }
            thead th, tbody td { padding: 8px 6px; }
            .assistant-shell {
                padding: 16px;
                border-radius: 16px;
                height: calc(100vh - 100px);
                min-height: 560px;
            }
            .assistant-head h3 { font-size: 20px; }
            .assistant-input-row {
                flex-direction: column;
                align-items: stretch;
            }
            .assistant-send { width: 100%; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="brand">Portfolio Manager</div>
    <button class="tab-btn active" data-tab="overview">组合总览</button>
    <button class="tab-btn" data-tab="operations">投资操作</button>
    <button class="tab-btn" data-tab="assistant">投资助手</button>
</nav>

<div class="container">

    <!-- Tab 1: 组合总览 -->
    <div id="tab-overview" class="tab-content active">
        <div class="stat-row">
            <div class="stat-card">
                <div class="label">总价值</div>
                <div class="value" id="stat-total-value">--</div>
                <div class="sub" id="stat-total-change">--</div>
            </div>
            <div class="stat-card">
                <div class="label">总盈亏</div>
                <div class="value" id="stat-total-pnl">--</div>
                <div class="sub" id="stat-total-return">--</div>
            </div>
            <div class="stat-card">
                <div class="label">现金余额</div>
                <div class="value" style="color:#3b82f6" id="stat-cash">--</div>
                <div class="sub" style="color:#94a3b8" id="stat-cash-pct">--</div>
            </div>
        </div>
        <div class="chart-row">
            <div class="card">
                <div class="card-title">资产分配</div>
                <div class="chart-wrapper">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-title">每日收益</div>
                <div class="chart-wrapper">
                    <canvas id="barLineChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab 2: 投资操作 -->
    <div id="tab-operations" class="tab-content">
        <!-- Holdings -->
        <div class="card">
            <div class="card-title">我的持仓</div>
            <div id="holdings-content">
                <div class="loading">加载中...</div>
            </div>
        </div>
        <!-- Market Stocks -->
        <div class="card">
            <div class="card-title">市场标的</div>
            <div id="stocks-content">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- Tab 3: 投资助手 -->
    <div id="tab-assistant" class="tab-content">
        <div class="assistant-shell">
            <div class="assistant-head">
                <h3>投资助手</h3>
                <p>投资助手</p>
            </div>

            <div id="assistant-messages" class="assistant-messages"></div>

            <div class="assistant-input-row">
                <textarea id="assistant-input" rows="1" placeholder="例如：请结合我当前持仓给出调仓建议"></textarea>
                <button id="assistant-send" class="assistant-send">发送</button>
            </div>
            <div id="assistant-error" class="assistant-error" style="display:none"></div>

            <div class="assistant-insights">
                <div class="assistant-chart-card">
                    <h4>当前资产分配</h4>
                    <div class="assistant-chart-wrap"><canvas id="assistantPieChart"></canvas></div>
                </div>
                <div class="assistant-chart-card">
                    <h4>持仓盈亏率</h4>
                    <div class="assistant-chart-wrap"><canvas id="assistantBarChart"></canvas></div>
                </div>
                <div class="assistant-chart-card">
                    <h4>7天组合表现</h4>
                    <div class="assistant-chart-wrap"><canvas id="assistantLineChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Trade Modal -->
<div class="modal-overlay" id="tradeModal">
    <div class="modal">
        <h3 id="modal-title">买入</h3>
        <div class="info-row">
            <span class="info-label">代码</span>
            <span class="info-value" id="modal-code">--</span>
        </div>
        <div class="info-row">
            <span class="info-label">名称</span>
            <span class="info-value" id="modal-name">--</span>
        </div>
        <div class="info-row">
            <span class="info-label">当前价格</span>
            <span class="info-value" id="modal-price">--</span>
        </div>
        <div id="modal-max-sell-row" style="display:none" class="info-row">
            <span class="info-label">最大可卖</span>
            <span class="info-value" id="modal-max-sell">--</span>
        </div>
        <label for="modal-qty">数量</label>
        <input type="number" id="modal-qty" min="1" value="1" placeholder="输入数量">
        <div class="estimate" id="modal-estimate">预计花费: <strong>$0.00</strong></div>
        <div class="error-msg" id="modal-error"></div>
        <div class="btn-row">
            <button class="btn btn-cancel" id="modal-cancel">取消</button>
            <button class="btn btn-confirm-buy" id="modal-confirm">确认</button>
        </div>
    </div>
</div>

<!-- Hover Chart -->
<div class="hover-chart" id="hoverChart">
    <canvas id="hoverChartCanvas"></canvas>
</div>

<script>
/* ================================================================
   Portfolio Manager – Frontend Logic
   ================================================================ */

// ---------- State ----------
let overviewData = null;
let weeklyData = null;
let holdingsData = null;
let stocksData = null;
const dataLoaded = { overview: false, operations: false };

// ---------- Chart instances ----------
let pieChartInstance = null;
let barLineChartInstance = null;
let hoverChartInstance = null;
let assistantPieChartInstance = null;
let assistantBarChartInstance = null;
let assistantLineChartInstance = null;

// ---------- Assistant state ----------
let assistantSending = false;
let assistantInputAutoGrowBound = false;
const assistantHistory = [
    {
        role: 'assistant',
        content: '你好，我是你的投资助手。你可以直接问我：当前持仓风险、调仓建议、建仓方向等。'
    }
];

// ---------- Helpers ----------
function fmt(n) {
    return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtPct(n) {
    return (n >= 0 ? '+' : '') + Number(n).toFixed(2) + '%';
}
function pnlClass(n) { return n >= 0 ? 'positive' : 'negative'; }

function autoGrowAssistantInput() {
    const input = document.getElementById('assistant-input');
    if (!input) return;
    input.style.height = 'auto';
    const maxHeight = 180;
    input.style.height = Math.min(input.scrollHeight, maxHeight) + 'px';
}

// ---------- Tab switching ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if (tab === 'overview' && !dataLoaded.overview) loadOverview();
        if (tab === 'operations' && !dataLoaded.operations) loadOperations();
        if (tab === 'assistant') initAssistantTab();
    });
});

/* ================================================================
   Tab 1 – 组合总览
   ================================================================ */
async function loadOverview(force) {
    try {
        const [ovRes, wkRes] = await Promise.all([
            fetch('/api/portfolio/overview').then(r => r.json()),
            fetch('/api/portfolio/weekly-performance').then(r => r.json())
        ]);
        overviewData = ovRes;
        weeklyData = wkRes;
        renderStatCards(); // 用 overviewData 渲染顶部的4个统计卡片（总值/总盈亏/日盈亏/现金）
        renderPieChart();  // 用 overviewData.allocation 画资产分配饼图
        renderBarLineChart();   // 用 weeklyData 画7天收益柱状+折线图
        dataLoaded.overview = true; //标记总览页数据已加载完成
    } catch (e) {
        console.error('Failed to load overview:', e);
    }
}

function renderStatCards() {
    const d = overviewData;
    document.getElementById('stat-total-value').textContent = fmt(d.totalValue);
    const chg = d.totalProfit || 0;
    const chgEl = document.getElementById('stat-total-change');
    chgEl.textContent = (chg >= 0 ? '▲ ' : '▼ ') + fmt(Math.abs(chg));
    chgEl.className = 'sub ' + pnlClass(chg);

    const pnlEl = document.getElementById('stat-total-pnl');
    pnlEl.textContent = fmt(d.totalProfit);
    pnlEl.className = 'value ' + pnlClass(d.totalProfit);
    const retEl = document.getElementById('stat-total-return');
    retEl.textContent = fmtPct(d.returnRate);
    retEl.className = 'sub ' + pnlClass(d.totalProfit);

    document.getElementById('stat-cash').textContent = fmt(d.cashBalance);
    const cashPct = d.totalValue > 0 ? (d.cashBalance / d.totalValue * 100) : 0;
    document.getElementById('stat-cash-pct').textContent = '占总价值 ' + cashPct.toFixed(1) + '%';
}

function renderPieChart() {
    const d = overviewData;
    const colorMap = { 'STOCK': '#3b82f6', 'BOND': '#22c55e', 'CASH': '#f97316' };
    const labels = (d.allocation || []).map(a => a.assetType + '  ' + fmt(a.value));
    const values = (d.allocation || []).map(a => a.value || 0);
    const colors = (d.allocation || []).map(a => colorMap[a.assetType] || '#94a3b8');
    const ctx = document.getElementById('pieChart').getContext('2d');
    if (pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: labels.map((l, i) => l + '  ' + fmt(values[i])),
            datasets: [{
                data: values,
                backgroundColor: colors,
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom', labels: { padding: 16, font: { size: 13 } } },
                tooltip: {
                    callbacks: {
                        label: ctx => {
                            const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                            const pct = total > 0 ? (ctx.parsed / total * 100).toFixed(1) : 0;
                            return ctx.label + '  (' + pct + '%)';
                        }
                    }
                }
            }
        }
    });
}

function renderBarLineChart() {
    const d = weeklyData;
    if (!d || !d.length) return;
    const labels = d.map(r => String(r.date));
    const pnlData = d.map(r => r.dailyProfit || 0);
    const retData = d.map(r => r.returnRate || 0);
    const ctx = document.getElementById('barLineChart').getContext('2d');
    if (barLineChartInstance) barLineChartInstance.destroy();
    barLineChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [
                {
                    label: '每日收益',
                    data: pnlData,
                    backgroundColor: pnlData.map(v => v >= 0 ? 'rgba(34,197,94,.6)' : 'rgba(239,68,68,.6)'),
                    borderRadius: 4,
                    yAxisID: 'y',
                    order: 2
                },
                {
                    label: '收益率',
                    data: retData,
                    type: 'line',
                    borderColor: '#8b5cf6',
                    backgroundColor: 'rgba(139,92,246,.1)',
                    tension: .3,
                    pointRadius: 4,
                    pointBackgroundColor: '#8b5cf6',
                    yAxisID: 'y1',
                    order: 1
                }
            ]
        },
        options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false },
            scales: {
                y: { position: 'left', title: { display: true, text: '收益 ($)' } },
                y1: {
                    position: 'right',
                    title: { display: true, text: '收益率 (%)' },
                    grid: { drawOnChartArea: false },
                    ticks: { callback: v => v + '%' }
                }
            },
            plugins: {
                legend: { position: 'bottom', labels: { padding: 16 } }
            }
        }
    });
}

/* ================================================================
   Tab 2 – 投资操作
   ================================================================ */
async function loadOperations(force) {
    try {
        const [hRes, sRes] = await Promise.all([
            fetch('/api/portfolio/holdings').then(r => r.json()),
            fetch('/api/stocks').then(r => r.json())
        ]);
        holdingsData = hRes;
        stocksData = sRes;
        renderHoldings();
        renderStocks();
        dataLoaded.operations = true;
    } catch (e) {
        console.error('Failed to load operations:', e);
    }
}

/* ================================================================
   Hover Chart – 7-day price
   ================================================================ */
let hoverTimeout = null;

function attachHoverEvents() {
    document.querySelectorAll('.stock-row').forEach(row => {
        row.addEventListener('mouseenter', function (e) {
            const stockId = this.dataset.stockId;
            clearTimeout(hoverTimeout);
            hoverTimeout = setTimeout(() => showHoverChart(stockId, e), 350);
        });
        row.addEventListener('mouseleave', () => {
            clearTimeout(hoverTimeout);
            hideHoverChart();
        });
    });
}

async function showHoverChart(stockId, event) {
    const container = document.getElementById('hoverChart');
    const rect = event.currentTarget.getBoundingClientRect();
    container.style.display = 'block';
    container.style.left = (rect.right + 10) + 'px';
    container.style.top = rect.top + 'px';
    // Check if fits on right, else show on left
    if (rect.right + 300 > window.innerWidth) {
        container.style.left = (rect.left - 290) + 'px';
    }
    try {
        const data = await fetch('/api/stocks/' + stockId + '/prices').then(r => r.json());
        const ctx = document.getElementById('hoverChartCanvas').getContext('2d');
        if (hoverChartInstance) hoverChartInstance.destroy();
        hoverChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => String(d.date)),
                datasets: [{
                    data: data.map(d => d.closePrice),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59,130,246,.08)',
                    fill: true,
                    tension: .3,
                    pointRadius: 3,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: true } },
                scales: {
                    x: { ticks: { font: { size: 10 } } },
                    y: { ticks: { font: { size: 10 } } }
                }
            }
        });
    } catch (e) {
        container.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:20px;">暂无数据</p>';
    }
}

function hideHoverChart() {
    const container = document.getElementById('hoverChart');
    container.style.display = 'none';
    container.innerHTML = '<canvas id="hoverChartCanvas"></canvas>';
}

/* ================================================================
   Trade Modal
   ================================================================ */
let modalState = { stockId: null, stockSymbol: null, type: null, price: 0, name: '', code: '', maxQty: 0 };

function openTrade(stockSymbol, stockIdNum, type) {
    // Find stock info
    let stock = null;
    let holding = null;
    if (stocksData) stock = stocksData.find(s => s.symbol === stockSymbol);
    if (holdingsData) holding = holdingsData.find(h => h.symbol === stockSymbol);

    const price = stock ? stock.currentPrice : (holding ? holding.currentPrice : 0);
    const name = stock ? stock.name : (holding ? holding.name : stockSymbol);

    modalState = {
        stockId: stockIdNum,
        stockSymbol: stockSymbol,
        type: type,
        price: price,
        name: name,
        code: stockSymbol,
        maxQty: holding ? holding.quantity : 0
    };

    document.getElementById('modal-title').textContent = type === 'BUY' ? '买入 ' + name : '卖出 ' + name;
    document.getElementById('modal-code').textContent = stockSymbol;
    document.getElementById('modal-name').textContent = name;
    document.getElementById('modal-price').textContent = fmt(price);
    document.getElementById('modal-qty').value = 1;
    document.getElementById('modal-error').style.display = 'none';

    const maxSellRow = document.getElementById('modal-max-sell-row');
    const confirmBtn = document.getElementById('modal-confirm');
    if (type === 'SELL') {
        maxSellRow.style.display = 'flex';
        document.getElementById('modal-max-sell').textContent = modalState.maxQty + ' 股';
        confirmBtn.className = 'btn btn-confirm-sell';
        confirmBtn.textContent = '确认卖出';
    } else {
        maxSellRow.style.display = 'none';
        confirmBtn.className = 'btn btn-confirm-buy';
        confirmBtn.textContent = '确认买入';
    }

    updateEstimate();
    document.getElementById('tradeModal').classList.add('show');
}

function updateEstimate() {
    const qty = parseInt(document.getElementById('modal-qty').value) || 0;
    const total = qty * modalState.price;
    const el = document.getElementById('modal-estimate');
    if (modalState.type === 'BUY') {
        el.innerHTML = '预计花费: <strong>' + fmt(total) + '</strong>';
    } else {
        el.innerHTML = '预计收入: <strong>' + fmt(total) + '</strong>';
    }
}

document.getElementById('modal-qty').addEventListener('input', updateEstimate);

document.getElementById('modal-cancel').addEventListener('click', () => {
    document.getElementById('tradeModal').classList.remove('show');
});

document.getElementById('tradeModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) {
        document.getElementById('tradeModal').classList.remove('show');
    }
});

document.getElementById('modal-confirm').addEventListener('click', async () => {
    const qty = parseInt(document.getElementById('modal-qty').value);
    const errEl = document.getElementById('modal-error');
    errEl.style.display = 'none';

    if (!qty || qty <= 0) {
        errEl.textContent = '请输入有效数量';
        errEl.style.display = 'block';
        return;
    }

    if (modalState.type === 'SELL' && qty > modalState.maxQty) {
        errEl.textContent = '卖出数量不能超过持仓数量 (' + modalState.maxQty + ')';
        errEl.style.display = 'block';
        return;
    }

    try {
        const resp = await fetch('/api/portfolio/transactions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                stockId: modalState.stockId,
                type: modalState.type,
                quantity: qty
            })
        });
        if (!resp.ok) {
            const text = await resp.text();
            throw new Error(text || '交易失败');
        }
        document.getElementById('tradeModal').classList.remove('show');
        // Refresh data
        dataLoaded.overview = false;
        dataLoaded.operations = false;
        loadOverview();
        loadOperations();
    } catch (e) {
        errEl.textContent = e.message || '请求失败，请重试';
        errEl.style.display = 'block';
    }
});

/* ================================================================
   Tab 3 – 投资助手
   ================================================================ */
function initAssistantTab() {
    renderAssistantMessages();
    if (!assistantInputAutoGrowBound) {
        const input = document.getElementById('assistant-input');
        if (input) {
            input.addEventListener('input', autoGrowAssistantInput);
            input.addEventListener('keydown', handleAssistantInputKeydown);
            assistantInputAutoGrowBound = true;
        }
    }
    autoGrowAssistantInput();
}

function handleAssistantInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendAssistantMessage();
    }
}

function renderAssistantMessages() {
    const box = document.getElementById('assistant-messages');
    destroyAssistantCharts();
    box.innerHTML = assistantHistory
        .map((m, index) => {
            let html = '<div class="assistant-msg ' + m.role + '">';
            html += escapeHtml(m.content || '');
            if (m.role === 'assistant' && hasRenderableCharts(m.charts)) {
                html += renderAssistantMessageChartsMarkup(index, m.charts);
            }
            html += '</div>';
            return html;
        })
        .join('');
    renderAssistantMessageCharts();
    box.scrollTop = box.scrollHeight;
}

function renderAssistantMessageChartsMarkup(index, charts) {
    const selectedCharts = selectAssistantCharts(charts);
    if (!selectedCharts.length) {
        return '';
    }

    const allocationTitle = escapeHtml((charts.recommended_allocation && charts.recommended_allocation.title) || '建议持仓占比');
    const driversTitle = escapeHtml((charts.expected_drivers && charts.expected_drivers.title) || '收益驱动因子');
    const forecastTitle = escapeHtml('AI 预测盈亏走势');
    const showLine = selectedCharts.includes('line');
    const showPie = selectedCharts.includes('pie');
    const showBar = selectedCharts.includes('bar');

    return `
        <div class="assistant-msg-charts">
            ${showLine ? `<div class="assistant-msg-chart-card" style="${(showPie || showBar) ? 'grid-column: 1 / -1;' : ''}">
                <h5>${forecastTitle}</h5>
                <div class="assistant-msg-chart-wrap"><canvas id="assistant-msg-line-${index}"></canvas></div>
            </div>` : ''}
            ${showPie ? `<div class="assistant-msg-chart-card">
                <h5>${allocationTitle}</h5>
                <div class="assistant-msg-chart-wrap"><canvas id="assistant-msg-pie-${index}"></canvas></div>
            </div>` : ''}
            ${showBar ? `<div class="assistant-msg-chart-card" style="${showPie ? '' : 'grid-column: 1 / -1;'}">
                <h5>${driversTitle}</h5>
                <div class="assistant-msg-chart-wrap"><canvas id="assistant-msg-bar-${index}"></canvas></div>
            </div>` : ''}
        </div>
    `;
}

function renderAssistantMessageCharts() {
    assistantHistory.forEach((message, index) => {
        if (!message.charts) return;

        const pieCanvas = document.getElementById(`assistant-msg-pie-${index}`);
        const barCanvas = document.getElementById(`assistant-msg-bar-${index}`);
        const lineCanvas = document.getElementById(`assistant-msg-line-${index}`);

        if (pieCanvas) {
            assistantPieChartInstance = buildAllocationChart(pieCanvas.getContext('2d'), message.charts.recommended_allocation);
        }
        if (barCanvas) {
            assistantBarChartInstance = buildDriversChart(barCanvas.getContext('2d'), message.charts.expected_drivers);
        }
        if (lineCanvas) {
            assistantLineChartInstance = buildForecastChart(
                lineCanvas.getContext('2d'),
                message.charts.current_portfolio_forecast,
                message.charts.recommended_portfolio_forecast
            );
        }
    });
}

function escapeHtml(text) {
    return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
}

async function sendAssistantMessage() {
    const input = document.getElementById('assistant-input');
    const sendBtn = document.getElementById('assistant-send');
    const err = document.getElementById('assistant-error');

    const text = (input.value || '').trim();
    if (!text || assistantSending) return;

    assistantSending = true;
    sendBtn.disabled = true;
    err.style.display = 'none';

    assistantHistory.push({ role: 'user', content: text });
    renderAssistantMessages();
    input.value = '';
    autoGrowAssistantInput();

    try {
        assistantHistory.push({ role: 'assistant', content: '' });
        renderAssistantMessages();

        const requestHistory = assistantHistory
            .filter(item => item.role === 'user' || (item.role === 'assistant' && item.content && item.content.trim()))
            .map(item => ({ role: item.role, content: item.content }));

        const resp = await fetch('/api/portfolio/ai-assistant/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: text,
                history: requestHistory
            })
        });

        if (!resp.ok) {
            const t = await resp.text();
            throw new Error(t || 'AI接口调用失败');
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        const assistantMessage = assistantHistory[assistantHistory.length - 1];
        let streamedText = '';

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            streamedText += decoder.decode(value, { stream: true });
            const parsed = splitAssistantPayload(streamedText);
            assistantMessage.content = parsed.text;
            renderAssistantMessages();
        }

        streamedText += decoder.decode();
        const parsed = splitAssistantPayload(streamedText);
        assistantMessage.content = parsed.text;
        if (!assistantMessage.content.trim()) {
            assistantMessage.content = '模型本次没有返回内容。';
        }
        if (hasRenderableCharts(parsed.charts)) {
            assistantMessage.charts = parsed.charts;
        }
        renderAssistantMessages();
    } catch (e) {
        if (assistantHistory.length && assistantHistory[assistantHistory.length - 1].role === 'assistant') {
            assistantHistory.pop();
            renderAssistantMessages();
        }
        err.textContent = e.message || 'AI 助手暂时不可用，请稍后重试';
        err.style.display = 'block';
    } finally {
        assistantSending = false;
        sendBtn.disabled = false;
    }
}

document.getElementById('assistant-send').addEventListener('click', sendAssistantMessage);

function splitAssistantPayload(rawText) {
    const marker = '<<AI_CHARTS_JSON>>';
    const idx = rawText.indexOf(marker);
    if (idx === -1) {
        const fallback = tryParseChartsFallback(rawText);
        return fallback || { text: rawText, charts: null };
    }

    const text = rawText.slice(0, idx).trim();
    const jsonText = rawText.slice(idx + marker.length).trim();
    if (!jsonText) {
        return { text, charts: null };
    }

    try {
        return { text, charts: JSON.parse(jsonText) };
    } catch {
        return { text, charts: null };
    }
}

function tryParseChartsFallback(rawText) {
    const braceIndices = [];
    for (let i = 0; i < rawText.length; i += 1) {
        if (rawText[i] === '{') {
            braceIndices.push(i);
        }
    }

    for (const idx of braceIndices) {
        const jsonText = rawText.slice(idx).trim();
        if (!jsonText.includes('current_portfolio_forecast')
            && !jsonText.includes('recommended_allocation')
            && !jsonText.includes('expected_drivers')) {
            continue;
        }
        try {
            return {
                text: rawText.slice(0, idx).trim(),
                charts: JSON.parse(jsonText)
            };
        } catch {
            // Try next candidate opening brace.
        }
    }

    return null;
}

function hasRenderableCharts(charts) {
    if (!charts) return false;

    const hasLine = charts.current_portfolio_forecast
        && Array.isArray(charts.current_portfolio_forecast.dates)
        && Array.isArray(charts.current_portfolio_forecast.values)
        && charts.current_portfolio_forecast.dates.length > 1
        && charts.current_portfolio_forecast.values.length > 1;

    const hasPie = charts.recommended_allocation
        && Array.isArray(charts.recommended_allocation.labels)
        && Array.isArray(charts.recommended_allocation.values)
        && charts.recommended_allocation.labels.length > 0
        && charts.recommended_allocation.values.length > 0;

    const hasBar = charts.expected_drivers
        && Array.isArray(charts.expected_drivers.labels)
        && Array.isArray(charts.expected_drivers.values)
        && charts.expected_drivers.labels.length > 0
        && charts.expected_drivers.values.length > 0;

    return hasLine || hasPie || hasBar;
}

function selectAssistantCharts(charts) {
    if (!hasRenderableCharts(charts)) {
        return [];
    }

    const selected = [];
    const hasLine = charts.current_portfolio_forecast
        && Array.isArray(charts.current_portfolio_forecast.dates)
        && Array.isArray(charts.current_portfolio_forecast.values)
        && charts.current_portfolio_forecast.dates.length > 1
        && charts.current_portfolio_forecast.values.length > 1;
    const hasPie = charts.recommended_allocation
        && Array.isArray(charts.recommended_allocation.labels)
        && Array.isArray(charts.recommended_allocation.values)
        && charts.recommended_allocation.labels.length > 0;
    const hasBar = charts.expected_drivers
        && Array.isArray(charts.expected_drivers.labels)
        && Array.isArray(charts.expected_drivers.values)
        && charts.expected_drivers.labels.length > 0;

    if (hasLine) selected.push('line');
    if (hasPie) selected.push('pie');
    if (hasBar) selected.push('bar');

    return selected;
}

function destroyAssistantCharts() {
    if (assistantPieChartInstance) assistantPieChartInstance.destroy();
    if (assistantBarChartInstance) assistantBarChartInstance.destroy();
    if (assistantLineChartInstance) assistantLineChartInstance.destroy();
    assistantPieChartInstance = null;
    assistantBarChartInstance = null;
    assistantLineChartInstance = null;
}

function buildAllocationChart(ctx, data) {
    if (!data || !Array.isArray(data.labels) || !Array.isArray(data.values)) return;
    return new Chart(ctx, {
        type: 'pie',
        data: {
            labels: data.labels,
            datasets: [{
                data: data.values,
                backgroundColor: ['#2563eb', '#16a34a', '#f97316', '#8b5cf6', '#ec4899'],
                borderColor: '#fff',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 10 } }
            }
        }
    });
}

function buildDriversChart(ctx, data) {
    if (!data || !Array.isArray(data.labels) || !Array.isArray(data.values)) return;
    return new Chart(ctx, {
        type: 'bar',
        data: {
            labels: data.labels,
            datasets: [{
                label: data.title || '收益驱动因子',
                data: data.values,
                backgroundColor: data.values.map(v => v >= 0 ? 'rgba(34,197,94,.65)' : 'rgba(239,68,68,.65)'),
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: {
                    ticks: { callback: value => value + '%' }
                }
            }
        }
    });
}

function buildForecastChart(ctx, currentForecast, recommendedForecast) {
    if (!currentForecast) return;
    if (!Array.isArray(currentForecast.dates) || !Array.isArray(currentForecast.values)) return;

    const datasets = [
        {
            label: currentForecast.title || '当前持仓预测盈亏',
            data: currentForecast.values,
            borderColor: '#ef4444',
            backgroundColor: 'rgba(239,68,68,.10)',
            fill: false,
            tension: .3,
            pointRadius: 3
        }
    ];

    if (recommendedForecast && Array.isArray(recommendedForecast.values)) {
        datasets.push({
            label: recommendedForecast.title || '建议调仓后预测盈亏',
            data: recommendedForecast.values,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37,99,235,.10)',
            fill: false,
            tension: .3,
            pointRadius: 3
        });
    }

    return new Chart(ctx, {
        type: 'line',
        data: {
            labels: currentForecast.dates,
            datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: true, position: 'bottom' } },
            scales: {
                y: {
                    ticks: { callback: value => value + '%' }
                }
            }
        }
    });
}
