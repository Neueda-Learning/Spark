spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfoliodb?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
app.service-name=Portfolio Manager Service
app.version=1.0.0
spring.main.banner-mode=off

market-data.sync.enabled=true
market-data.sync.post-close-cron=0 30 18 * * MON-FRI
market-data.sync.reconciliation-cron=0 0 8 * * MON-FRI
market-data.sync.zone=America/New_York
market-data.sync.close-cutoff=18:30
market-data.backfill-months=60
market-data.overlap-days=10
market-data.stale-days=7
market-data.backfill-on-startup=true
market-data.yahoo.base-url=https://query1.finance.yahoo.com

# AI assistant provider configuration
# OpenAI default:
# ai.provider=openai
# ai.chat-url=https://api.openai.com/v1/chat/completions
# ai.model=gpt-4o-mini
# ai.api-key=YOUR_OPENAI_API_KEY
#
# Qwen (DashScope OpenAI compatible endpoint) example:
# ai.provider=qwen
# ai.chat-url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
# ai.model=qwen-plus
# ai.api-key=YOUR_DASHSCOPE_API_KEY
ai.provider=${AI_PROVIDER:qwen}
ai.chat-url=${AI_CHAT_URL:https://ws-6u2tfkgzqwqi507e.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions}
ai.model=${AI_MODEL:qwen-plus}
ai.api-key=${AI_API_KEY:}

# Market data source for AI context:
# internal (default): use current system market feed (DB/price service)
# yahoo: call Yahoo Finance directly
ai.market-data.mode=${AI_MARKET_DATA_MODE:internal}
